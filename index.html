<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RSF</title>
  <meta name="description" content="RSF — everything in one place.">
  <meta name="theme-color" content="#0F0F0F">

  <style>
    @font-face {
      font-family: "Montserrat";
      src: url("/fonts/montserrat-regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Montserrat";
      src: url("/fonts/montserrat-medium.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Montserrat";
      src: url("/fonts/montserrat-bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    html {
      background: #0F0F0F;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: #0F0F0F;
      color: #FFFFFF;
      font-family: "Montserrat", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;

      opacity: 0;
      transform: translateY(3px);
      transition:
        opacity 90ms ease-out,
        transform 90ms ease-out;
    }

    body.page-loaded {
      opacity: 1;
      transform: translateY(0);
    }

    a {
      color: inherit;
    }

    .topbar {
      position: relative;
      height: 68px;
      padding: 0 32px;
      border-bottom: 1px solid #242424;
      display: flex;
      align-items: center;
    }

    .logo {
      color: #FFFFFF;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .navigation {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);

      display: flex;
      align-items: center;
      gap: 34px;
      height: 100%;
    }

    .navigation > a,
    .nav-dropdown-trigger {
      position: relative;

      display: inline-flex;
      align-items: center;
      gap: 5px;

      color: #FFFFFF;
      text-decoration: none;

      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;

      opacity: 0.48;

      transition:
        opacity 90ms ease-out,
        font-weight 90ms ease-out;
    }

    .navigation > a:hover,
    .nav-dropdown-trigger:hover {
      opacity: 0.9;
    }

    .navigation > a.active,
    .nav-dropdown-trigger.active {
      opacity: 1;
      font-weight: 700;
    }

    .nav-dropdown {
      position: relative;
      height: 68px;

      display: flex;
      align-items: center;
    }

    .nav-arrow {
      font-size: 8px;
      line-height: 1;
      opacity: 0.65;
      transform: translateY(-1px);

      transition:
        opacity 90ms ease-out,
        transform 90ms ease-out;
    }

    .nav-dropdown:hover .nav-arrow,
    .nav-dropdown:focus-within .nav-arrow {
      opacity: 1;
      transform: translateY(1px);
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 7px);
      left: 50%;
      transform: translateX(-50%) translateY(-3px);

      width: 170px;
      padding: 6px;

      background: #151515;
      border: 1px solid #292929;

      display: flex;
      flex-direction: column;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 90ms ease-out,
        transform 90ms ease-out,
        visibility 90ms ease-out;

      z-index: 20;
    }

    .dropdown-menu::before {
      content: "";
      position: absolute;
      top: -8px;
      left: 0;
      right: 0;
      height: 8px;
    }

    .nav-dropdown:hover .dropdown-menu,
    .nav-dropdown:focus-within .dropdown-menu {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .dropdown-menu a {
      min-height: 32px;
      padding: 0 10px;

      display: flex;
      align-items: center;

      color: #FFFFFF;
      text-decoration: none;

      font-size: 10px;
      font-weight: 500;

      opacity: 0.52;

      transition:
        opacity 90ms ease-out,
        background 90ms ease-out;
    }

    .dropdown-menu a:hover,
    .dropdown-menu a:focus-visible {
      background: #202020;
      opacity: 1;
      outline: none;
    }

    .main-content {
      width: min(1180px, calc(100% - 64px));
      min-height: calc(100vh - 126px);

      margin: 0 auto;

      display: flex;
      align-items: center;
    }

    .hero {
      max-width: 650px;
    }

    .hero h1 {
      margin: 0;

      font-size: clamp(52px, 8vw, 92px);
      line-height: 0.92;
      letter-spacing: -0.075em;
      font-weight: 700;
    }

    .hero p {
      margin: 28px 0 0;

      max-width: 430px;

      font-size: 13px;
      line-height: 1.7;
      font-weight: 400;

      color: #FFFFFF;
      opacity: 0.45;
    }

    .hero-line {
      width: 34px;
      height: 1px;
      margin-top: 28px;

      background: #FFFFFF;
      opacity: 0.35;
    }

    .footer {
      min-height: 58px;
      padding: 0 32px;

      border-top: 1px solid #242424;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .footer-left,
    .footer-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .footer span,
    .footer a {
      color: #FFFFFF;
      text-decoration: none;

      font-size: 9px;
      font-weight: 500;

      opacity: 0.35;
    }

    .footer a:hover {
      opacity: 0.75;
    }

    @media (max-width: 760px) {
      .topbar {
        padding: 0 20px;
      }

      .navigation {
        position: static;
        transform: none;

        margin-left: auto;

        gap: 20px;
      }

      .navigation > a:nth-last-child(1) {
        display: none;
      }

      .nav-dropdown:nth-child(3) {
        display: none;
      }

      .navigation {
        gap: 18px;
      }

      .main-content {
        width: calc(100% - 40px);
        min-height: calc(100vh - 126px);
      }

      .hero h1 {
        font-size: clamp(48px, 15vw, 72px);
      }

      .footer {
        padding: 14px 20px;
        flex-direction: column;
        align-items: flex-start;
        gap: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body {
        transition: none;
        transform: none;
      }

      .dropdown-menu,
      .nav-arrow,
      .navigation > a,
      .nav-dropdown-trigger,
      .dropdown-menu a {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <a href="/" class="logo">RSF</a>

    <nav class="navigation" aria-label="Primary navigation">

      <a href="/" class="active">MAIN</a>

      <div class="nav-dropdown">
        <a href="/database" class="nav-dropdown-trigger">
          DATABASE
          <span class="nav-arrow" aria-hidden="true">▾</span>
        </a>

        <div class="dropdown-menu">
          <a href="/database">Playerbase</a>
          <a href="/database">Teams</a>
          <a href="/database">Seasons</a>
        </div>
      </div>

      <div class="nav-dropdown">
        <a href="/community" class="nav-dropdown-trigger">
          COMMUNITY
          <span class="nav-arrow" aria-hidden="true">▾</span>
        </a>

        <div class="dropdown-menu">
          <a href="/community">Videos</a>
          <a href="/community">Community Latest</a>
          <a href="/community">Development</a>
          <a href="/community">Resources</a>
        </div>
      </div>

      <a href="/arcade">ARCADE</a>

      <a href="/rsf">RSF</a>

    </nav>
  </header>

  <main class="main-content">
    <section class="hero">
      <h1>Welcome.</h1>

      <p>
        Everything in one place.
      </p>

      <div class="hero-line"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-left">
      <span>RSF</span>
      <span>© 2026</span>
    </div>

    <div class="footer-right">
      <a href="/privacy">Privacy Policy</a>
      <a href="/terms">Terms of Use</a>
    </div>
  </footer>

  <script>
    window.addEventListener("load", () => {
      requestAnimationFrame(() => {
        document.body.classList.add("page-loaded");
      });
    });

    document.querySelectorAll("a[href]").forEach(link => {
      link.addEventListener("click", event => {
        const url = new URL(link.href, window.location.href);

        if (
          url.origin !== window.location.origin ||
          link.target === "_blank" ||
          event.ctrlKey ||
          event.metaKey ||
          event.shiftKey ||
          event.altKey
        ) {
          return;
        }

        if (url.href === window.location.href) {
          return;
        }

        event.preventDefault();

        document.body.classList.remove("page-loaded");

        setTimeout(() => {
          window.location.href = url.href;
        }, 90);
      });
    });
  </script>

</body>
</html>
