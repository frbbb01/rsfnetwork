<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>404 — RSF</title>

  <style>
    @font-face {
      font-family: "Montserrat";
      src: url("./fonts/Montserrat-Regular.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: "Montserrat";
      src: url("./fonts/Montserrat-Medium.woff2") format("woff2");
      font-weight: 500;
      font-display: swap;
    }

    @font-face {
      font-family: "Montserrat";
      src: url("./fonts/Montserrat-Bold.woff2") format("woff2");
      font-weight: 700;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #101010;
      color: #f5f5f5;
      font-family: "Montserrat", Arial, sans-serif;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0 30px;
    }

    header {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #292929;
    }

    .logo {
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.08em;
    }

    .code {
      color: #666;
      font-size: 9px;
      letter-spacing: .15em;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .content {
      animation: enter 900ms cubic-bezier(.16, 1, .3, 1) both;
    }

    .number {
      font-size: clamp(150px, 27vw, 390px);
      line-height: .72;
      font-weight: 700;
      letter-spacing: -.14em;
      animation: float 5s ease-in-out infinite;
    }

    .number span {
      display: inline-block;
    }

    .number .zero {
      color: transparent;
      -webkit-text-stroke: 2px #f5f5f5;
    }

    h1 {
      margin-top: 70px;
      font-size: clamp(28px, 4vw, 52px);
      font-weight: 500;
      letter-spacing: -.06em;
    }

    p {
      max-width: 430px;
      margin: 18px auto 0;
      color: #707070;
      font-size: 12px;
      line-height: 1.7;
    }

    .button {
      display: inline-flex;
      margin-top: 30px;
      padding: 12px 20px;
      border: 1px solid #383838;
      color: #fff;
      text-decoration: none;
      font-size: 10px;
      transition: background .2s ease, color .2s ease;
    }

    .button:hover {
      background: #fff;
      color: #101010;
    }

    footer {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #292929;
      color: #555;
      font-size: 9px;
      letter-spacing: .12em;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(30px);
        filter: blur(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    @media (max-width: 600px) {
      .page {
        padding: 0 18px;
      }

      .number {
        font-size: 35vw;
      }

      h1 {
        margin-top: 55px;
        font-size: 30px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
    }
  </style>

</head>

<body>

  <div class="page">

<header>
  <a href="/" class="logo">RSF</a>
  <span class="code">ERROR / 404</span>
</header>

<main>
  <div class="content">
    <div class="number">
      <span>4</span><span class="zero">0</span><span>4</span>
    </div>

    <h1>Page not found.</h1>

    <p>
      Whatever you're looking for isn't here.
      Try heading back to somewhere that exists.
    </p>

    <a href="/" class="button">RETURN HOME →</a>
  </div>
</main>

<footer>
  <span>RSF</span>
  <span>© 2026</span>
</footer>


  </div>

</body>
</html>
